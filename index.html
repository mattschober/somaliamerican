<style>
  :root {
    --flag-blue: #4189dd;
    --flag-blue-dark: #2c62a8;
    --flag-blue-deep: #1c3f6e;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    /* The gradient shows through while the video loads, or if it can't play. */
    background: linear-gradient(160deg, var(--flag-blue-deep), var(--flag-blue-dark) 55%, var(--flag-blue));
    overflow: hidden;
  }

  /* One full-viewport hero video, nothing else. */
  .hero {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .hero video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: transparent;
    cursor: pointer;
  }
</style>
</head>
<body>

<!--
  Hero video. Drop hero.mp4 (and optionally hero.webm) in the repo root.
  It autoplays muted and loops; clicking it toggles sound.
-->
<div class="hero">
  <video id="hero-video" autoplay muted loop playsinline preload="auto">
    <source src="hero.webm" type="video/webm">
    <source src="hero.mp4" type="video/mp4">
  </video>
</div>

<script>
  (function () {
    var player = document.getElementById('hero-video');
    if (!player) return;
    // Autoplay is only allowed while muted, so a click is what turns sound on.
    player.addEventListener('click', function () {
      player.muted = !player.muted;
      if (!player.muted && player.paused) player.play();
    });
  })();
</script>

</body>
