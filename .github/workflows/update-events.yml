name: Update events

# Scans the Somali community sites listed in scripts/event_sources.json and
# rewrites the Upcoming Events section of index.html with the soonest five.
#
# No setup or credentials are needed. To change which sites are scanned, edit
# scripts/event_sources.json -- no code change required.
#
# A source that is unreachable or publishes no structured event data is logged
# and skipped. If every source comes up empty the page is left untouched, so
# the committed cards remain on the site.

on:
  schedule:
    # 11:00 UTC daily - early morning in Minnesota, year round.
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scan_events.py'
      - 'scripts/event_sources.json'
      - '.github/workflows/update-events.yml'

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The scanner is standard library only, so there is nothing to install.
      - name: Scan for upcoming events
        run: python3 scripts/scan_events.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain index.html)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update upcoming events from community sites"
          git push
